<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<title>Carnet Muscu UTMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
[hidden]{display:none!important}
/* Layout: carnet d'entraînement mobile-first, une colonne, blanc dominant, noir pour le texte, couleur réservée à l'action en cours et aux alertes */
:root{
  --bg:#ffffff; --fg:#0c0d10; --muted:#6b6e78; --line:#e6e7ec; --soft:#f4f5f8;
  --accent:#2a46d8; --accent-ink:#ffffff; --ok:#1f8a4c; --warn:#c77a00; --bad:#c62a2a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f12; --fg:#f1f2f5; --muted:#9a9ca6; --line:#262830; --soft:#17191e;
  --accent:#7b8eff; --accent-ink:#0e0f12; --ok:#4cc584; --warn:#f0a63a; --bad:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f12; --fg:#f1f2f5; --muted:#9a9ca6; --line:#262830; --soft:#17191e;
  --accent:#7b8eff; --accent-ink:#0e0f12; --ok:#4cc584; --warn:#f0a63a; --bad:#ff6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
nav{display:flex;gap:4px;margin-top:12px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 14px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0;line-height:1.1;text-wrap:balance}
section{padding-block:20px;display:flex;flex-direction:column;gap:16px}
.status{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font:600 13px var(--body);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg)}
.chip.phase{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;border:1.5px solid var(--fg);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:12px 6px;background:var(--bg);color:var(--fg);border:0;border-right:1.5px solid var(--fg);font:700 16px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{color:var(--muted);cursor:not-allowed}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:16px;font:700 18px var(--display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;width:100%}
.ghost{background:none;border:1.5px solid var(--fg);color:var(--fg);border-radius:10px;padding:12px 14px;font:600 14px var(--body);cursor:pointer}
.small{padding:8px 10px;font-size:13px}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{border:1.5px solid var(--warn);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.banner.bad{border-color:var(--bad)}
.banner p{margin:0}
.pains{display:flex;gap:8px;flex-wrap:wrap}
.ex{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-head > div{min-width:0}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.ex-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sk{width:104px;flex:none;aspect-ratio:3/2;max-width:100%;background:var(--soft);border-radius:8px}
.sk.mini{width:54px;border-radius:5px}
.sk .gr{stroke:var(--line);stroke-width:1.5}
.sk .bd polyline,.sk .bd circle{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sk .bx{fill:var(--bg);stroke:var(--muted);stroke-width:1.5}
.sk .wt{fill:var(--fg)}
.sk .ac{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.sk .arw line,.sk .arw polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vid{color:var(--accent);font:600 13px var(--body);text-decoration:none;margin-top:4px}
.vid:hover{text-decoration:underline}
.trow{display:flex;gap:8px;align-items:center}
.trow .vid{color:var(--fg);font:400 14px var(--body);margin:0}
.target{font:700 15px var(--mono);white-space:nowrap}
.target span{display:block;text-align:right}
.cue{font-size:14px;color:var(--muted);margin:2px 0 0}
.last{font-size:13px;color:var(--muted);font-family:var(--mono)}
.last b{color:var(--ok);font-family:var(--body)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.set .n{font:700 14px var(--mono);color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;min-width:0;font:700 18px var(--mono);padding:12px 34px 12px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.check{width:52px;height:48px;border-radius:8px;border:1.5px solid var(--fg);background:var(--bg);color:var(--fg);font-size:22px;cursor:pointer;display:grid;place-items:center}
.set.done .field input{border-color:transparent;background:var(--soft)}
.set.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.fname{font:600 16px var(--body);padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.addset{align-self:flex-start;background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:4px 0;cursor:pointer;text-decoration:underline}
label.lab{display:flex;flex-direction:column;gap:6px;font:600 14px var(--body)}
textarea,select{font:16px var(--body);padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.scale button{padding:10px 0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;font:700 13px var(--mono);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scale.pain button[aria-pressed="true"].p1{background:var(--warn);border-color:var(--warn);color:#fff}
.scale.pain button[aria-pressed="true"].p2{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--fg);color:var(--bg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font:700 34px var(--mono);font-variant-numeric:tabular-nums;flex:1}
.timer .t small{font:500 12px var(--body);display:block;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.timer button{background:none;border:1.5px solid var(--bg);color:var(--bg);border-radius:8px;padding:10px 12px;font:600 14px var(--body);cursor:pointer}
.timer.over{background:var(--ok)}
.hist{display:flex;flex-direction:column}
.hrow{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:6px}
.hrow .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hrow .meta{font:500 13px var(--mono);color:var(--muted)}
.hrow ul{margin:0;padding-left:18px;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.prog-table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.num{font-family:var(--mono);white-space:nowrap}
.phase-block{border-top:2px solid var(--fg);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.phase-block.current{border-top-color:var(--accent)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.toggle input{width:22px;height:22px;flex:none;margin-top:1px}
.savestate{font:500 12px var(--mono);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1}
@media (prefers-reduced-motion:no-preference){.check{transition:background .15s}}
</style>

</head>

<div class="wrap">
<header>

function lastFor(exId){
  for(const s of finished()){ const e=s.ex?.[exId]; if(e && e.sets.some(x=>x.done)) return {s, sets:e.sets.filter(x=>x.done)}; }
  return null;
}
function canProgress(ex, last){
  if(!last || ex.t!=="load") return false;
  const max = repMax(ex);
  const allTop = last.sets.length>=ex.s && last.sets.every(x=>Number(x.r)>=max);
  const pain = (last.s.painDuring||0)>0 || (last.s.painMorning||0)>0;
  return allTop && !pain;
}
function startSession(key){
  const phase = S.cfg.phase, list = P[phase][key];
  const ex = {};
  list.forEach(e=>{
    const last = lastFor(e.id);
    ex[e.id] = {sets: Array.from({length:e.s},(_,i)=>{
      const ref = last?.sets[Math.min(i,last.sets.length-1)];
      return {kg: ref?.kg ?? (e.k||""), r: ref?.r??"", done:false};
    })};
  });
  S.draft = {_id: today()+"_"+key+"_"+Math.random().toString(36).slice(2,7), date:today(), key, phase, week:weekNo(),
    startedAt:new Date().toISOString(), finished:false, ex, rpe:null, painDuring:0, painMorning:null, notes:""};
  persist(S.draft); wake(); render(); window.scrollTo(0,0);
}

let audioCtx=null;
function beep(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.35); }catch(e){} }
function startTimer(sec){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  clearInterval(S.timer?.iv);
  S.timer = {end: Date.now()+sec*1000, beeped:false};
  S.timer.iv = setInterval(tick,250); tick(); $("#timer").hidden=false;
}
function tick(){
  if(!S.timer) return;
  const left = Math.round((S.timer.end-Date.now())/1000), over = left<=0, a=Math.abs(left);
  $("#timerText").innerHTML = `<small>${over?"Récup terminée, série suivante":"Récup"}</small>${over?"+":""}${Math.floor(a/60)}:${String(a%60).padStart(2,"0")}`;
  $("#timer").classList.toggle("over",over);
  if(over && !S.timer.beeped){ S.timer.beeped=true; beep(); try{navigator.vibrate?.(300)}catch(e){} }
}
function stopTimer(){ clearInterval(S.timer?.iv); S.timer=null; $("#timer").hidden=true; }
$("#tPlus").onclick=()=>{ if(S.timer){ S.timer.end+=15000; S.timer.beeped=false; tick(); } };
$("#tMinus").onclick=()=>{ if(S.timer){ S.timer.end-=15000; tick(); } };
$("#tStop").onclick=stopTimer;

      <li>Course et muscu pilotées ensemble par Rémi. 2 séances par semaine, en dehors des séances de course.</li>
      <li>Force maximale d'abord, pliométrie en dernier : c'est ce qui sollicite le plus l'os.</li>
      <li>Le gainage pur (planche, gainage latéral, dead bug, superman) se fait à la maison, hors de ce carnet.</li>
      <li>Squat barre dès S1 : barre seule, puis +2,5 à 5 kg par séance seulement si la douleur reste à 0.</li>
    </ul>
    ${[1,2,3].map(n=>`<div class="phase-block ${n===ph?"current":""}">
      <div class="ex-head"><div><div class="eyebrow">Phase ${n} · ${PHASES[n].weeks}</div><h3>${PHASES[n].name}</h3></div>
      ${n===ph?`<span class="chip phase">En cours</span>`:`<button class="ghost small" data-setphase="${n}">Passer en phase ${n}</button>`}</div>
      <p class="note">${PHASES[n].goal}</p>
      ${Object.entries(P[n]).map(([k,l])=>`<div><strong>Séance ${k}</strong><div class="prog-table"><table><tbody>${l.map(e=>`<tr><td><div class="trow">${sketch(e.id,"sk mini")}<a class="vid" href="${vidUrl(e.id)}" target="_blank" rel="noopener">${esc(e.n)} ↗</a></div></td><td class="num">${e.s}×${esc(e.r)} ${e.u?esc(e.u):e.t==="time"?"s":""}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}
      <p class="note"><strong>Pour passer à la suite :</strong> ${PHASES[n].gate}</p>
      ${n===3?`<label class="toggle"><input type="checkbox" id="plyo" ${S.cfg.plyoOk?"checked":""}> Feu vert médecin et Rémi pour la pliométrie (débloque la séance C)</label>`:""}
    </div>`).join("")}
    <p class="note">Version ${APP_VERSION}</p>
  </section>`;
}
function backupBlock(){
  const n = finished().length;
  return `<section>
    <div><div class="eyebrow">Sauvegarde</div><h2>Tes données</h2></div>
    <p class="note">Les séances sont enregistrées dans ce téléphone, dans l'app ajoutée à l'écran d'accueil. Exporte une sauvegarde de temps en temps (par exemple dans Fichiers ou iCloud Drive) : tu pourras la réimporter sur un autre appareil ou après un changement de téléphone.</p>
    <div class="row">
      <button class="ghost" id="exportBtn">Exporter (${n} séance${n>1?"s":""})</button>
      <button class="ghost" id="importBtn">Importer une sauvegarde</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="note" id="backupMsg" role="status"></p>
  </section>`;
}
function backupMsg(t){ const el=$("#backupMsg"); if(el) el.textContent=t; }
async function exportData(){
  const data = JSON.stringify({app:"carnet-muscu", version:1, exportedAt:new Date().toISOString(), cfg:S.cfg, sessions:S.sessions}, null, 1);
  const name = "carnet-muscu-"+today()+".json";
  const file = new File([data], name, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Sauvegarde Carnet Muscu"}); backupMsg("Sauvegarde partagée."); return; }
  }catch(e){ if(e && e.name==="AbortError"){ backupMsg("Export annulé."); return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  backupMsg("Fichier "+name+" téléchargé.");
}
function importData(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(j.app!=="carnet-muscu" || !Array.isArray(j.sessions)) throw new Error("format");
      const byId=new Map(S.sessions.map(x=>[x._id,x])); let added=0;
      j.sessions.forEach(x=>{ if(x && x._id){ if(!byId.has(x._id)) added++; byId.set(x._id,x); } });
      S.sessions=[...byId.values()];
      if(j.cfg && !finished().length) S.cfg={...S.cfg,...j.cfg};
      localSave(); render(); backupMsg(added+" séance"+(added>1?"s":"")+" ajoutée"+(added>1?"s":"")+" depuis la sauvegarde.");
    }catch(e){ backupMsg("Ce fichier n'est pas une sauvegarde du Carnet Muscu. Choisis un fichier carnet-muscu-AAAA-MM-JJ.json."); }
  };
  r.readAsText(f);
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const w = weekNo(), left = daysBetween(today(),UTMB);
  $("#countdown").innerHTML = `S${w} · UTMB J-${left}`;
  if(!S.loaded){ view.innerHTML = `<section><p class="note">${S.err||"Chargement de tes séances…"}</p></section>`; return; }
  view.innerHTML = S.tab==="seance"?renderSeance():S.tab==="historique"?renderHist()+backupBlock():renderProg();
}

/* ===================== ÉVÉNEMENTS ===================== */
document.querySelector("nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return; S.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
view.addEventListener("input",e=>{
  const t=e.target; if(!S.draft) return;
  if(t.id==="notes"){ S.draft.notes=t.value; persistSoon(); return; }
  if(t.hasAttribute("data-fname")){ const id=t.closest("[data-ex]").dataset.ex, f=(S.draft.free||[]).find(x=>x.id===id); if(f){ f.name=t.value; persistSoon(); } return; }
  const exEl=t.closest("[data-ex]"), setEl=t.closest("[data-i]"); if(!exEl||!setEl) return;
  S.draft.ex[exEl.dataset.ex].sets[+setEl.dataset.i][t.dataset.f]=t.value.replace(",","."); persistSoon();
});
view.addEventListener("click",e=>{
  const t=e.target;
  const key=t.closest("[data-key]"); if(key&&!key.disabled){ S.pickKey=key.dataset.key; S.pickTouched=true; render(); return; }
  if(t.id==="go"){ startSession(S.pickKey); return; }
  const chk=t.closest("[data-check]");
  if(chk && S.draft){
    const exId=t.closest("[data-ex]").dataset.ex, i=+t.closest("[data-i]").dataset.i, set=S.draft.ex[exId].sets[i];
    const ex=P[S.draft.phase][S.draft.key].find(x=>x.id===exId) || {r:"10", rest:90};
    if(!set.done && set.r===""){ set.r=String(ex.r).split("-")[0]; }
    set.done=!set.done;
    // reporte la charge sur la série suivante vide
    const nx=S.draft.ex[exId].sets[i+1]; if(set.done&&nx&&!nx.done&&nx.kg===""&&set.kg!=="") nx.kg=set.kg;
    clearTimeout(saveTO); persist(S.draft);
    const y=window.scrollY; render(); window.scrollTo(0,y);
    if(set.done) startTimer(ex.rest);
    return;
  }
  if(t.id==="addFree" && S.draft){
    S.draft.free=S.draft.free||[]; const id="libre_"+Date.now().toString(36);
    S.draft.free.push({id,name:""}); S.draft.ex[id]={sets:Array.from({length:3},()=>({kg:"",r:"",done:false}))};
    persist(S.draft); const y=window.scrollY; render(); window.scrollTo(0,y);
    setTimeout(()=>document.getElementById("fn-"+id)?.focus(),50); return;
  }
  if(t.closest("[data-delfree]") && S.draft){
    const id=t.closest("[data-ex]").dataset.ex; S.draft.free=(S.draft.free||[]).filter(f=>f.id!==id); delete S.draft.ex[id];
    persist(S.draft); const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(t.closest("[data-add]") && S.draft){
    const exId=t.closest("[data-ex]").dataset.ex, sets=S.draft.ex[exId].sets, l=sets[sets.length-1];
    sets.push({kg:l?.kg??"",r:"",done:false}); persist(S.draft); const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  const sc=t.closest(".scale button");
  if(sc){
    const name=sc.parentElement.dataset.scale, v=+sc.dataset.v;
    if(name.startsWith("morning:")){
      const s=S.sessions.find(x=>x._id===name.slice(8)); if(s){ s.painMorning=v; persist(s); render(); } return;
    }
    if(S.draft){ S.draft[name]=v; persist(S.draft); sc.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===v)); }
    return;
  }
  if(t.id==="finish" && S.draft){
    S.draft.finished=true; S.draft.finishedAt=new Date().toISOString(); persist(S.draft);
    S.draft=null; S.pickTouched=false; stopTimer(); try{wl?.release()}catch(e){} S.tab="historique"; render(); window.scrollTo(0,0); return;
  }
  if(t.id==="cancel"){ $("#cancelConfirm").hidden=false; return; }
  if(t.id==="cancelNo"){ $("#cancelConfirm").hidden=true; return; }
  if(t.id==="cancelYes" && S.draft){ removeSession(S.draft._id); S.draft=null; stopTimer(); render(); return; }
  const sp=t.closest("[data-setphase]"); if(sp){ S.cfg.phase=+sp.dataset.setphase; saveCfg(); render(); return; }
});
view.addEventListener("change",e=>{
  if(e.target.id==="plyo"){ S.cfg.plyoOk=e.target.checked; saveCfg(); }
  if(e.target.id==="importFile" && e.target.files[0]){ importData(e.target.files[0]); e.target.value=""; }
});
view.addEventListener("click",e=>{
  if(e.target.id==="exportBtn") exportData();
  if(e.target.id==="importBtn") $("#importFile").click();
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.draft) wake(); });

/* ===================== DÉMARRAGE ===================== */
function afterLoad(){
  S.loaded=true;
  const open = S.sessions.filter(x=>!x.finished).sort((a,b)=>(b.startedAt||"").localeCompare(a.startedAt||""))[0];
  if(open && !S.draft) S.draft = JSON.parse(JSON.stringify(open));
  render();
}
render();
try{ navigator.storage?.persist?.(); }catch(e){}
if("serviceWorker" in navigator){
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded||S.draft) return; reloaded=true; location.reload(); });
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(reg=>{
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
  }).catch(()=>{}));
}
(async()=>{
  let db=null;
  try{ db = await window.claude?.use?.("db"); }catch(e){}
  if(!db){ S.local=true; localLoad(); afterLoad(); return; }
  S.db=db;
  S.loadTimer=setTimeout(()=>{ if(!S.loaded){ S.err="Impossible de joindre tes données pour l'instant. Vérifie la connexion, la page réessaie toute seule."; render(); } },10000);
  let gotCfg=false, gotS=false;
  const ready=()=>{ if(gotCfg&&gotS&&!S.loaded){ clearTimeout(S.loadTimer); afterLoad(); } };
  db.doc("config/reglages").onSnapshot(s=>{ if(s.exists) S.cfg={phase:1,plyoOk:false,...s.data()}; if(!s.metadata.fromCache||s.exists){ gotCfg=true; ready(); } if(S.loaded&&!S.draft) render(); },
    ()=>{ gotCfg=true; ready(); });
  db.collection("seances").onSnapshot(snap=>{
    S.sessions = snap.docs.map(d=>({_id:d.id,...JSON.parse(JSON.stringify(d.data()))}));
    if(!snap.metadata.fromCache || snap.size){ gotS=true; ready(); }
    if(S.loaded && !S.draft) render();
  }, e=>{ clearTimeout(S.loadTimer); S.err="Tes données ne sont pas accessibles depuis cette vue. Les séances seront gardées sur cet appareil."; S.local=true; localLoad(); afterLoad(); });
})();
</script>
